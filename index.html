<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NFG Portfolio</title>
  <!-- Font Awesome CDN for Telegram and Instagram icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    #particles-js {
      position: absolute;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 1;
    }

    .top-left-text {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 1.5em;
      color: #1e90ff;
      z-index: 3;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
    }

    .top-left-text:hover {
      color: #00b7eb;
    }

    .hamburger-menu {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 3;
      cursor: pointer;
    }

    .hamburger-icon {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 30px;
      height: 20px;
    }

    .hamburger-icon span {
      width: 100%;
      height: 3px;
      background-color: #1e90ff;
      transition: all 0.3s ease;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: 40px;
      right: 0;
      background-color: #1e90ff;
      border-radius: 5px;
      z-index: 3;
    }

    .dropdown-menu a {
      display: block;
      padding: 10px 20px;
      color: #fff;
      text-decoration: none;
      font-size: 1em;
      transition: background 0.3s;
    }

    .dropdown-menu a:hover {
      background-color: #00b7eb;
    }

    .container {
      text-align: center;
      z-index: 2;
    }

    .container h1 {
      font-size: 1.5em;
      margin-bottom: 10px;
    }

    .container .white-text {
      color: #fff;
    }

    .container .blue-text {
      color: #00b7eb;
    }

    .container h2 {
      font-size: 1.5em;
      margin-bottom: 10px;
      color: #fff;
    }

    .container .typed-text {
      color: #00b7eb;
    }

    .container .white-text-typed {
      color: #fff;
    }

    .container .description {
      font-size: 0.8em;
      color: #fff;
      margin-top: 60px;
      max-width: 300px;
      line-height: 1.4;
    }

    .container .btn {
      display: inline-block;
      padding: 10px 20px;
      border: 2px solid #00b7eb;
      border-radius: 25px;
      color: #00b7eb;
      text-decoration: none;
      font-size: 1.2em;
      margin-top: 40px;
      transition: background 0.3s, color 0.3s;
    }

    .container .btn:hover {
      background: #00b7eb;
      color: #000;
    }

    .profile-img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      margin-bottom: 20px;
      border: 2px solid #00b7eb;
      background: #fff;
      transition: transform 2s ease-in-out;
      animation: float 3s ease-in-out infinite;
      cursor: pointer;
    }

    .profile-img:hover {
      transform: scale(1.05);
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    /* Social icons styles with animations */
    .social-icons {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .social-icons a {
      color: #00b7eb;
      font-size: 2em;
      transition: all 0.3s ease;
      opacity: 0;
      transform: translateY(20px);
      animation: slideIn 0.5s ease forwards;
    }

    .social-icons a:nth-child(1) { animation-delay: 0.2s; }
    .social-icons a:nth-child(2) { animation-delay: 0.4s; }

    .social-icons a:hover {
      color: #1e90ff;
      transform: scale(1.2) rotate(10deg);
    }

    @keyframes slideIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div id="particles-js"></div>

  <!-- Top-left clickable typed text -->
  <a href="https://t.me/Adarsh_modder" target="_blank" class="top-left-text">
    <span id="typed-top"></span>
  </a>

  <!-- Hamburger Menu -->
  <div class="hamburger-menu" onclick="toggleMenu()">
    <div class="hamburger-icon">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <div class="dropdown-menu" id="dropdownMenu">
      <a href="https://www.instagram.com/adarshyadav_000111/" target="_blank">Insta</a>
      <a href="https://wa.me/qr/CQEQVW7W2IXCE1" target="_blank">Contact</a>
    </div>
  </div>

  <div class="container">
    <!-- Profile image with link -->
    <a href="https://www.instagram.com/adarshyadav_000111/" target="_blank">
      <img src="https://i.ibb.co/5xJB6Y3c/1000083874.jpg" alt="Profile" class="profile-img" />
    </a>

    <h1><span class="white-text">Hi, It's </span><span class="blue-text">ADARSH</span></h1>
    <h2><span class="white-text-typed">I'm a</span> <span class="typed-text" id="typed-text"></span></h2>

    <p class="description">
      I am an ordinary person who likes things related to technology and happens to be lucky to have a little experience about technology and others. Even though I only learned using autodidactic methods because of a reason that required me to do so :)
    </p>

    <a href="https://adarsh-yadav.vercel.app/" target="_blank" class="btn">See More</a>

    <!-- Social media icons -->
    <div class="social-icons">
      <a href="https://t.me/Adarsh_modder" target="_blank" title="Telegram">
        <i class="fab fa-telegram-plane"></i>
      </a>
      <a href="https://www.instagram.com/adarshyadav_000111/" target="_blank" title="Instagram">
        <i class="fab fa-instagram"></i>
      </a>
    </div>
  </div>

  <!-- Background music -->
  <audio autoplay loop hidden>
    <source src="https://vocaroo.com/media_command.php?media=s0uAk1Gc5SYU&command=download_mp3" type="audio/mpeg" />
  </audio>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
  <script>
    // Particle effect
    particlesJS("particles-js", {
      particles: {
        number: { value: 80, density: { enable: true, value_area: 800 } },
        color: { value: "#00b7eb" },
        shape: { type: "circle", stroke: { width: 0, color: "#000000" } },
        opacity: { value: 0.5 },
        size: { value: 3, random: true },
        line_linked: {
          enable: true,
          distance: 150,
          color: "#00b7eb",
          opacity: 0.4,
          width: 1,
        },
        move: {
          enable: true,
          speed: 6,
          direction: "none",
          random: false,
          straight: false,
          out_mode: "out",
          bounce: false,
        },
      },
      interactivity: {
        detect_on: "canvas",
        events: {
          onhover: { enable: true, mode: "repulse" },
          onclick: { enable: true, mode: "push" },
          resize: true,
        },
        modes: {
          repulse: { distance: 100, duration: 0.4 },
          push: { particles_nb: 4 },
        },
      },
      retina_detect: true,
    });

    // Typed animation for top-left text
    var typedTop = new Typed("#typed-top", {
      strings: ["NFG 領先"],
      typeSpeed: 150,
      backSpeed: 0,
      showCursor: false,
      loop: true,
      backDelay: 2000,
      fadeOut: true,
      fadeOutDelay: 1000,
    });

    // Typed animation for main typed text
    var typed = new Typed("#typed-text", {
      strings: ["Web Developer", "Modder", "Application Developer"],
      typeSpeed: 50,
      backSpeed: 30,
      backDelay: 1000,
      loop: true,
    });

    // Toggle dropdown menu
    function toggleMenu() {
      var dropdown = document.getElementById("dropdownMenu");
      if (dropdown.style.display === "block") {
        dropdown.style.display = "none";
      } else {
        dropdown.style.display = "block";
      }
    }
  </script>
</body>
</html>
